name: Generate clients

on:
  workflow_dispatch:
    inputs:
      client:
        description: 'Client to regenerate (leave empty or "all" to regenerate everything).'
        required: false
        default: "all"
        type: string
      generator_ref:
        description: "nu-http-client-generator ref to use (branch, tag, or SHA)."
        required: false
        default: "main"
        type: string
  push:
    branches: [main]
    paths:
      - "clients.yaml"
      - "scripts/generate.nu"
      - "scripts/diff-clients.nu"
      - ".github/workflows/generate.yml"

concurrency:
  group: generate-${{ github.event.inputs.client || github.event_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      EVENT_NAME: ${{ github.event_name }}
      DISPATCH_CLIENT: ${{ github.event.inputs.client || 'all' }}
      GENERATOR_REF: ${{ github.event.inputs.generator_ref || 'main' }}
      BEFORE: ${{ github.event.before }}
      AFTER: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nushell
        uses: hustcer/setup-nu@v3
        with:
          version: "*"

      - name: Clone generator
        run: |
          git clone --depth=1 --branch "$GENERATOR_REF" \
            https://github.com/lassoColombo/nu-http-client-generator.git _generator

      - name: Generate clients
        id: gen
        run: |
          set -e
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "scope=$DISPATCH_CLIENT" >> "$GITHUB_OUTPUT"
            nu scripts/generate.nu "$DISPATCH_CLIENT" --force
            exit 0
          fi

          # Push event — regenerate only entries that changed in clients.yaml.
          out=$(nu scripts/diff-clients.nu "$BEFORE" "$AFTER")
          regen=$(printf '%s\n' "$out" | sed -n 's/^regen: //p')
          delete=$(printf '%s\n' "$out" | sed -n 's/^delete: //p')

          for p in $delete; do
            echo "Removing $p"
            rm -f "$p"
          done

          if [ -z "$regen" ] && [ -z "$delete" ]; then
            echo "No client entries changed."
            echo "scope=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$regen" ]; then
            # Only deletions — still refresh CLIENTS.md.
            nu scripts/generate.nu --list-only
            echo "scope=deletions" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Regenerating: $regen"
          echo "scope=$regen" >> "$GITHUB_OUTPUT"
          failed=""
          for n in $regen; do
            if ! nu scripts/generate.nu "$n" --force; then
              failed="$failed $n"
            fi
          done
          if [ -n "$failed" ]; then
            echo "Failed to generate:$failed" >&2
            exit 1
          fi

      - name: Commit & push
        # Always run, even if some clients failed to generate — the script
        # exits non-zero on any failure, but partially-successful regens
        # should still be committed.
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A clients/ CLIENTS.md
          if git diff --cached --quiet; then
            echo "No changes — nothing to commit."
            exit 0
          fi
          scope="${{ steps.gen.outputs.scope }}"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$scope" = "" ] || [ "$scope" = "all" ]; then
              msg="chore(clients): regenerate all"
            else
              msg="chore(clients): regenerate ${scope}"
            fi
          else
            if [ "$scope" = "deletions" ]; then
              msg="chore(clients): apply registry deletions"
            else
              count=$(printf '%s\n' $scope | wc -w | tr -d ' ')
              if [ "$count" = "1" ]; then
                msg="chore(clients): regenerate ${scope}"
              else
                msg="chore(clients): regenerate ${count} clients"$'\n\n'"${scope// /$'\n'}"
              fi
            fi
          fi
          git commit -m "$msg"
          git push

name: Generate clients

on:
  schedule:
    - cron: "0 4 * * *" # 04:00 UTC daily — regenerates all
  workflow_dispatch:
    inputs:
      name:
        description: "Single client name to regenerate. Leave empty to regenerate all (or use 'category')."
        required: false
        default: ""
        type: string
      category:
        description: "Category to regenerate. Mutually exclusive with 'name'."
        required: false
        default: ""
        type: string
      generator_ref:
        description: "nu-http-client-generator ref to use (branch, tag, or SHA)."
        required: false
        default: "main"
        type: string

concurrency:
  group: generate-${{ github.event.inputs.name || github.event.inputs.category || 'all' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      INPUT_NAME: ${{ github.event.inputs.name }}
      INPUT_CATEGORY: ${{ github.event.inputs.category }}
      GENERATOR_REF: ${{ github.event.inputs.generator_ref || 'main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nushell
        uses: hustcer/setup-nu@v3
        with:
          version: "*"

      - name: Clone generator
        run: |
          git clone --depth=1 --branch "$GENERATOR_REF" \
            https://github.com/lassoColombo/nu-http-client-generator.git _generator

      - name: Snapshot HEAD pre-commit
        id: presha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Generate clients
        run: |
          set -e
          if [ -n "$INPUT_NAME" ] && [ -n "$INPUT_CATEGORY" ]; then
            echo "Cannot pass both 'name' and 'category' inputs." >&2
            exit 1
          fi
          if [ -n "$INPUT_NAME" ]; then
            nu scripts/generate.nu --force --name "$INPUT_NAME"
          elif [ -n "$INPUT_CATEGORY" ]; then
            nu scripts/generate.nu --force --category "$INPUT_CATEGORY"
          else
            nu scripts/generate.nu --force
          fi

      - name: Commit & push
        # Always run, even if some clients failed to generate — the script
        # exits non-zero on any failure, but partially-successful regens
        # should still be committed.
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A clients/
          if git diff --cached --quiet; then
            echo "No changes — nothing to commit."
            exit 0
          fi
          if [ -n "$INPUT_NAME" ]; then
            msg="chore(clients): regenerate ${INPUT_NAME}"
          elif [ -n "$INPUT_CATEGORY" ]; then
            msg="chore(clients): regenerate category ${INPUT_CATEGORY}"
          else
            msg="chore(clients): regenerate all"
          fi
          git commit -m "$msg"
          git push

      - name: Tag datever
        if: success()
        env:
          TZ: UTC
          PRE_SHA: ${{ steps.presha.outputs.sha }}
        run: |
          set -e
          # Only tag if this run actually produced a new commit.
          if [ "$(git rev-parse HEAD)" = "$PRE_SHA" ]; then
            echo "No new commit produced — skipping tag."
            exit 0
          fi
          git fetch --tags
          base="v$(date -u +'%Y.%m.%d')"
          tag="$base"
          n=1
          while git rev-parse -q --verify "refs/tags/$tag" >/dev/null \
             || git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; do
            n=$((n+1))
            tag="${base}.${n}"
          done
          git tag -a "$tag" -m "$tag"
          git push origin "$tag"
          echo "Tagged $tag"

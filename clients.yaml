# Registry of HTTP clients to generate, grouped by category.
#
# Structure:
#   clients:
#     <category>:
#       - name: ...        # required — output filename (becomes `clients/<category>/<name>.nu`)
#         type: ...        # required — "openapi" or "graphql"
#         source: ...      # required — URL or path to the spec
#         flags: {...}     # optional — see policy below
#
# Names must be unique across categories (the workflow's `client` input
# is a bare name, so disambiguation would be impossible otherwise).
#
# Policy: clients must be generated from the FULL spec. Filter flags
# (--tags, --prefixes, --methods, --exclude-deprecated, --verb-map) must
# NOT appear here. Only render customizations are allowed:
# --default-base-url, --default-timeout, --default-headers,
# --token-env-var, --body-threshold, --no-introspection, --no-descriptions.
#
# Flag value shapes:
#   bool   → switch (only emitted when true)
#   string → --flag "value"
#   list   → --flag [a b c]
#   record → --flag {a: 1, b: 2}
#
# See https://github.com/lassoColombo/nu-http-client-generator for the full flag reference.

clients:
  ai:
    - name: openai
      type: openapi
      # Locally-patched copy of https://raw.githubusercontent.com/openai/openai-openapi/master/openapi.yaml
      # — the upstream spec has `minimum/maximum: ±9223372036854776000` on `seed`,
      # which is just outside i64 range and trips nushell's `from yaml`. Local
      # copy rounds those bounds to ±i64::MIN/MAX. Refresh manually when upstream changes.
      source: specs/openai.yaml
    - name: cohere
      type: openapi
      source: https://docs.cohere.com/openapi/cohere-api.json

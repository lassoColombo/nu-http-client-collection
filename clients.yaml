# Registry of HTTP clients to generate, grouped by category.
#
# Structure:
#   clients:
#     <category>:
#       - name: ...        # required — output filename (becomes `clients/<category>/<name>.nu`)
#         type: ...        # required — "openapi" or "graphql"
#         source: ...      # required — URL or path to the spec
#         flags: {...}     # optional — see policy below
#
# Names must be unique across categories (the workflow's `client` input
# is a bare name, so disambiguation would be impossible otherwise).
#
# Policy: clients must be generated from the FULL spec. Filter flags
# (--tags, --prefixes, --methods, --exclude-deprecated, --verb-map) must
# NOT appear here. Only render customizations are allowed:
# --default-base-url, --default-timeout, --default-headers,
# --token-env-var, --body-threshold, --no-introspection, --no-descriptions.
#
# Flag value shapes:
#   bool   → switch (only emitted when true)
#   string → --flag "value"
#   list   → --flag [a b c]
#   record → --flag {a: 1, b: 2}
#
# See https://github.com/lassoColombo/nu-http-client-generator for the full flag reference.

clients:
  sandbox:
    - name: petstore
      type: openapi
      source: https://petstore3.swagger.io/api/v3/openapi.json

  testing:
    - name: httpbin
      type: openapi
      source: https://httpbin.org/spec.json

  public-data:
    - name: countries
      type: graphql
      source: https://countries.trevorblades.com/graphql
      flags:
        default-base-url: https://countries.trevorblades.com/graphql

  weather:
    - name: weather-gov
      type: openapi
      source: https://api.weather.gov/openapi.json

  finance:
    - name: frankfurter
      type: openapi
      source: https://api.frankfurter.app/openapi.json

  ai:
    - name: openai
      type: openapi
      source: https://raw.githubusercontent.com/openai/openai-openapi/master/openapi.yaml

  payments:
    - name: stripe
      type: openapi
      source: https://raw.githubusercontent.com/stripe/openapi/master/openapi/spec3.json

  commerce:
    - name: square
      type: openapi
      source: https://raw.githubusercontent.com/square/connect-api-specification/master/api.json

  version-control:
    - name: github
      type: openapi
      source: https://raw.githubusercontent.com/github/rest-api-description/main/descriptions/api.github.com/api.github.com.json

  cloud:
    - name: digitalocean
      type: openapi
      source: https://raw.githubusercontent.com/digitalocean/openapi/main/specification/DigitalOcean-public.v2.yaml

  cdn:
    - name: cloudflare
      type: openapi
      source: https://raw.githubusercontent.com/cloudflare/api-schemas/main/openapi.json

  container-orchestration:
    - name: kubernetes
      type: openapi
      source: https://raw.githubusercontent.com/kubernetes/kubernetes/master/api/openapi-spec/swagger.json

  containers:
    - name: docker
      type: openapi
      source: https://raw.githubusercontent.com/moby/moby/master/api/swagger.yaml

  monitoring:
    - name: grafana
      type: openapi
      source: https://raw.githubusercontent.com/grafana/grafana/main/public/api-merged.json

  error-tracking:
    - name: sentry
      type: openapi
      source: https://raw.githubusercontent.com/getsentry/sentry-api-schema/main/openapi-derefed.json

  chat:
    - name: slack
      type: openapi
      source: https://raw.githubusercontent.com/slackapi/slack-api-specs/master/web-api/slack_web_openapi_v2.json

  telephony:
    - name: twilio
      type: openapi
      source: https://raw.githubusercontent.com/twilio/twilio-oai/main/spec/json/twilio_api_v2010.json

  issue-tracking:
    - name: jira
      type: openapi
      source: https://developer.atlassian.com/cloud/jira/platform/swagger-v3.v3.json

  project-mgmt:
    - name: asana
      type: openapi
      source: https://raw.githubusercontent.com/Asana/openapi/master/defs/asana_oas.yaml

  incident:
    - name: pagerduty
      type: openapi
      source: https://raw.githubusercontent.com/PagerDuty/api-schema/main/reference/REST/openapiv3.json

  storage:
    - name: box
      type: openapi
      source: https://raw.githubusercontent.com/box/box-openapi/main/openapi.json

  search:
    - name: typesense
      type: openapi
      source: https://raw.githubusercontent.com/typesense/typesense-api-spec/master/openapi.yml

  music:
    - name: spotify
      type: openapi
      source: https://raw.githubusercontent.com/sonallux/spotify-web-api/main/fixed-spotify-open-api.yml

  gaming:
    - name: pokeapi
      type: graphql
      source: https://beta.pokeapi.co/graphql/v1beta
      flags:
        default-base-url: https://beta.pokeapi.co/graphql/v1beta

  anime:
    - name: anilist
      type: graphql
      source: https://graphql.anilist.co
      flags:
        default-base-url: https://graphql.anilist.co

  sci-fi:
    - name: swapi
      type: graphql
      source: https://swapi-graphql.netlify.app/graphql
      flags:
        default-base-url: https://swapi-graphql.netlify.app/graphql
